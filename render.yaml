services:
  - type: web
    name: english-a-study
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BETA_USERNAME
        value: aj123
      - key: BETA_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
